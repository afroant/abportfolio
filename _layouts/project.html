---
layout: default
---

<div class="project-page">
  <h1>{{ page.title }}</h1>

  {% if page.images %}
  <div class="project-images">
    {% for image in page.images %}
    <img src="{{ image | relative_url }}" alt="{{ page.title }}">
    {% endfor %}
  </div>
  {% else %}
  <div class="project-images">
    <div class="placeholder">Images coming soon</div>
  </div>
  {% endif %}

  <div class="project-body">
    {{ content }}

    {% if page.url_label and page.project_url %}
    <a href="{{ page.project_url }}" class="project-link" target="_blank" rel="noopener">
      {{ page.url_label }}
    </a>
    {% endif %}
  </div>
</div>
